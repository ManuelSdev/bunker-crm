name: bunker-crm

services:
  bunker-crm-workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      # Montaje bind con flag :Z requerida para SELinux en Fedora/Bluefin
      - ..:/workspaces:Z
    # Mapeo de UID 1000 del host para Podman rootless (evita permisos root)
    userns_mode: "keep-id"
    tty: true
    # Mantiene el contenedor despierto consumiendo 0% de CPU
    command: /bin/sh -c "while sleep 1000; do :; done"

    ports:
      - "5173:5173" # Vite dev server
      - "8000:8000" # FastAPI

    networks:
      - bunker-crm-net

networks:
  bunker-crm-net:
    driver: bridge
